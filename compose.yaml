
services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./repo:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  manager:
    build:
      context: .
    profiles: ["admin"]
    volumes:
      - ./repo:/repo
      - ./keys:/keys
      - ./aports:/work/aports
    tmpfs:
      - /tmp
    entrypoint: ["/usr/local/bin/repo-manager.sh"]
