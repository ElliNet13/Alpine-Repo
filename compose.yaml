services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - ./repo:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  manager:
    build:
      context: .
    profiles: ["admin"]
    volumes:
      - ./repo:/repo
      - ./keys:/keys
      - ./aports:/work/aports
    tmpfs:
      - /tmp
    entrypoint: ["/usr/local/bin/repo-manager.sh"]

  tester:
    image: alpine:3.22
    profiles: ["admin"]
    stdin_open: true
    tty: true
    volumes:
      - ./keys/repo.rsa.pub:/etc/apk/keys/repo.rsa.pub:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' 'http://web:8080/v3' > /etc/apk/repositories
        apk update
        exec /bin/sh
