
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }
}
